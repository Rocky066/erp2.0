plugins { id 'com.android.application' }

android {
    namespace 'in.garumarajv.teacher'
    compileSdk 35

    defaultConfig {
        applicationId 'in.garumarajv.teacher'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    flavorDimensions += 'environment'
    productFlavors {
        local {
            dimension 'environment'
            applicationIdSuffix '.local'
            versionNameSuffix '-local'
            buildConfigField 'String', 'BASE_URL', '"http://192.168.0.100:3000"'
            manifestPlaceholders = [appLabel: 'GJV Teacher Local', cleartextTraffic: 'true']
        }
        production {
            dimension 'environment'
            buildConfigField 'String', 'BASE_URL', '"https://school.garumarajv.org"'
            manifestPlaceholders = [appLabel: 'Garumara Teacher', cleartextTraffic: 'false']
        }
    }

    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.work:work-runtime:2.10.0'
}