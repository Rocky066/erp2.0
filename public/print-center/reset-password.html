<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Password — Print Center Portal</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="icon" href="/neutral-school-logo.svg" type="image/svg+xml">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex min-h-screen items-center justify-center p-4 transition-colors duration-300 font-sans">

  <!-- Background decorations -->
  <div class="fixed -top-40 -left-40 w-96 h-96 rounded-full bg-amber-500/10 blur-3xl"></div>
  <div class="fixed -bottom-40 -right-40 w-96 h-96 rounded-full bg-blue-500/10 blur-3xl"></div>

  <div class="glass border border-slate-200/60 dark:border-slate-800/60 p-8 sm:p-10 rounded-3xl w-full max-w-md shadow-2xl relative z-10 space-y-6">
    <div class="text-center space-y-2">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-600 flex items-center justify-center text-2xl mx-auto shadow-lg shadow-amber-500/20 text-slate-950 font-black">
        🖨️
      </div>
      <h2 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">Print Center Security</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400 font-medium" id="header-desc">Set or reset your Print Operator account password</p>
    </div>

    <!-- Alert Box -->
    <div id="alert-box" class="hidden p-4 rounded-xl text-xs font-semibold border"></div>

    <form id="reset-form" class="space-y-4 text-xs font-medium">
      <div class="space-y-1">
        <label class="text-slate-600 dark:text-slate-300">New Password</label>
        <div class="relative">
          <input type="password" id="new-password" required minlength="6" placeholder="Min. 6 characters" class="w-full bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3.5 pr-10 text-slate-900 dark:text-white focus:outline-none focus:border-amber-500 transition-colors">
          <button type="button" id="toggle-pwd" class="absolute right-3.5 top-3.5 text-slate-400 hover:text-slate-200 text-sm">👁️</button>
        </div>
      </div>

      <div class="space-y-1">
        <label class="text-slate-600 dark:text-slate-300">Confirm Password</label>
        <input type="password" id="confirm-password" required minlength="6" placeholder="Re-enter new password" class="w-full bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3.5 text-slate-900 dark:text-white focus:outline-none focus:border-amber-500 transition-colors">
      </div>

      <button type="submit" id="submit-btn" class="bg-amber-500 hover:bg-amber-400 text-slate-900 w-full py-4 rounded-xl font-bold text-sm tracking-wide transition-colors shadow-lg shadow-amber-500/10 mt-2">
        Save New Password
      </button>
    </form>

    <div id="success-panel" class="hidden space-y-4 text-center">
      <div class="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl mx-auto border border-emerald-500/30">
        ✓
      </div>
      <p class="text-xs text-slate-300 font-semibold" id="success-msg">Your Print Center password has been updated successfully.</p>
      <a href="/print-center/login" class="inline-block bg-amber-500 hover:bg-amber-400 text-slate-900 px-6 py-3 rounded-xl font-bold text-xs tracking-wide transition-all shadow-md">
        Go to Print Portal Login &rarr;
      </a>
    </div>

    <div class="text-center pt-2">
      <a href="/print-center/login" class="text-slate-500 hover:text-slate-300 text-xs font-semibold block">&larr; Back to Print Center Login</a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const alertBox = document.getElementById('alert-box');
    const resetForm = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit-btn');
    const successPanel = document.getElementById('success-panel');
    const pwdInput = document.getElementById('new-password');
    const toggleBtn = document.getElementById('toggle-pwd');

    if (!token) {
      showAlert('Password reset token is missing from the URL. Please verify the setup link provided by your Super Administrator.', true);
      resetForm.classList.add('hidden');
    }

    toggleBtn.addEventListener('click', () => {
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
      toggleBtn.textContent = isPwd ? '🙈' : '👁️';
    });

    function showAlert(msg, isError = true) {
      alertBox.textContent = msg;
      alertBox.className = `p-4 rounded-xl text-xs font-semibold border ${isError ? 'bg-rose-500/10 text-rose-400 border-rose-500/20' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'}`;
      alertBox.classList.remove('hidden');
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');

      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword.length < 6) {
        return showAlert('Password must be at least 6 characters in length.', true);
      }
      if (newPassword !== confirmPassword) {
        return showAlert('Passwords do not match. Please re-enter them carefully.', true);
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="inline-block w-4 h-4 border-2 border-slate-900 border-t-transparent rounded-full animate-spin mr-2"></span> Updating Password...';

      try {
        const res = await fetch('/api/print-center/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to reset password');

        resetForm.classList.add('hidden');
        successPanel.classList.remove('hidden');
      } catch (err) {
        showAlert(err.message || 'Unable to reset password. The link may have expired.', true);
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Save New Password';
      }
    });
  </script>
</body>
</html>
