<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leadership Team - Garumara Jatiya Vidyalaya</title>
  <meta name="description" content="Meet the leadership team of Garumara Jatiya Vidyalaya - Principal, Vice Principal, and Academic Director.">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="icon" href="/logo.jpg" type="image/jpeg">
  <script src="/js/icon-runtime.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">

  <!-- Header -->
  <header id="shared-header" class="fixed top-0 left-0 w-full z-40 transition-all duration-300 bg-transparent"></header>

  <!-- Page Title Banner -->
  <section class="relative pt-36 pb-16 bg-slate-900 overflow-hidden flex items-center">
    <div class="absolute inset-0 z-0">
      <img src="uploads/hero_bg.jpg" alt="Banner" class="w-full h-full object-cover brightness-50 dark:brightness-[0.25]">
      <div class="absolute inset-0 bg-gradient-to-r from-slate-950 via-slate-950/80 to-transparent"></div>
    </div>
    <div class="container mx-auto px-6 relative z-10 space-y-3">
      <span id="message-school-badge" class="bg-amber-500/10 text-amber-500 border border-amber-500/25 px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider">School Leadership</span>
      <h1 class="text-4xl sm:text-5xl font-black text-white">Leadership Team</h1>
    </div>
  </section>

  <!-- Leadership Grid -->
  <section class="py-20 bg-white dark:bg-slate-900 transition-colors duration-300">
    <div class="container mx-auto px-6 max-w-6xl">
      <div id="leadership-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- Rendered dynamically -->
        <div class="col-span-3 text-center py-12 text-slate-400">Loading leadership profiles...</div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer id="shared-footer" class="bg-slate-950 text-slate-300 transition-colors duration-300 border-t border-slate-900"></footer>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function loadLeadership() {
      const grid = document.getElementById('leadership-grid');
      try {
        const leaders = await ApiService.getLeadership();
        grid.innerHTML = '';
        
        leaders.forEach(l => {
          const defaultAvatar = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%23eaeaea"/><circle cx=%2250%22 cy=%2235%22 r=%2216%22 fill=%22%23999%22/><path d=%22M20 88c4-25 56-25 60 0%22 fill=%22none%22 stroke=%22%23999%22 stroke-width=%2212%22 stroke-linecap=%22round%22/></svg>`;
          const photoSrc = l.photo || defaultAvatar;

          const card = document.createElement('div');
          card.className = 'glass border border-slate-200/60 dark:border-slate-800/60 p-8 rounded-3xl flex flex-col items-center text-center space-y-4 hover:shadow-xl transition-all duration-300';
          card.innerHTML = `
            <div class="w-36 h-36 rounded-full overflow-hidden border-4 border-amber-500/20 shadow-md bg-amber-100 dark:bg-slate-800 flex items-center justify-center shrink-0">
              <img src="${photoSrc}" alt="${l.name}" class="w-full h-full object-cover">
            </div>
            <div class="space-y-1">
              <h3 class="font-extrabold text-slate-900 dark:text-white text-lg">${l.name}${l.qualification ? `, <span class="text-sm font-semibold text-slate-450 dark:text-slate-400 font-mono">${l.qualification}</span>` : ''}</h3>
              <span class="text-xs font-semibold text-amber-500 uppercase block tracking-wider">${l.designation}</span>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed text-justify mt-2 whitespace-pre-wrap flex-1">${l.message}</p>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        grid.innerHTML = `<div class="col-span-3 text-center text-red-500 py-12">Failed to load leadership team details: ${err.message}</div>`;
      }
    }

    window.addEventListener('DOMContentLoaded', loadLeadership);
  </script>
</body>
</html>
